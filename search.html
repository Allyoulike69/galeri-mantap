        @media (min-width: 768px) {
        .section-title {

        }
        .section-title .title-ribbon {
            background: #b80006;

        .section-title .result-ribbon {

            color: #fff;

        }
        .comic-grid {
                grid-template-columns: repeat(5, 1fr);

        .comic-item {
            background: #000000;
            border-radius: 5px;
            border: 1px solid #333;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            padding-bottom: 30px;
        }
        .comic-item:hover {
            border-color: #ff0008;
            border-radius: 5px;
            z-index: 100;
            color: #ff0008;
            background: #1a1a1a;
        }
        .comic-thumb-container { aspect-ratio: 2/3; overflow: hidden; background: #222; border-radius: 5px 5px 0 0; }
        .comic-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .comic-title {
            position: absolute;
            background-color: #000000;
            border-radius: 0 0 5px 5px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0 3px 3px;
            text-align: center;
            color: #ff0008;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .comic-item:hover .comic-title {
            color: #ff0008;
            background: #1a1a1a;
            border: 1px solid #ff0008;
            border-top: none;
            border-radius: 0 0 5px 5px;
            padding: 0 3px 3px;
            margin: 0 -1px;
        }
        
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .pagination-btn, .pagination-arrow {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
        }
        .pagination-btn.active { color: #ffffff; font-weight: bold; background-color: #ff0008; }
        .pagination-btn:hover, .pagination-arrow:hover { color: #fff; background-color: #3b3737; }
        .pagination-arrow.disabled { display: none; }
        .pagination-dots { color: #888; padding: 8px 4px; font-size: 14px; }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            margin: 40px auto;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 500px;
            width: 90%;
            background: transparent;
            border: none;
        }
        #resultGrid:has(.empty-state) {
            display: block;
        }
        .empty-icon {
            font-size: clamp(60px, 15vw, 100px);
            margin-bottom: 24px;
            display: inline-block;
            animation: gentleFloat 3s ease-in-out infinite;
        }
        @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .empty-icon i {
            background: linear-gradient(135deg, #ffa74e, #ff5e7c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .empty-title {
            font-size: clamp(20px, 6vw, 28px);
            font-weight: 700;
            margin-bottom: 0;
            color: #fff;
            line-height: 1.3;
            padding: 0 15px;
        }
        
        #header-placeholder {
            width: 100%;

        @media (max-width: 768px) {
            .main-content-container { padding: 0 16px; }
            .pagination-btn, .pagination-arrow {

                font-size: 12px;
                min-width: 34px;
            }
        }
        @media (max-width: 480px) {
            .main-content-container { padding: 0 12px; }
            .pagination-btn, .pagination-arrow {
                padding: 5px 8px;
                font-size: 11px;
                min-width: 30px;
            }
            .pagination-dots {
                padding: 5px 2px;
                font-size: 11px;
            }
        }
        @media (min-width: 769px) {
            .main-content-container {

                margin: 0 auto;

    </style>

</head>
<body>

<div id="header-placeholder"></div>

<!-- Top Banner -->
<div id="topbanner-container"></div>

<div class="main-content-container">
    <h2 class="section-title"><span class="title-ribbon"><i class="fa-solid fa-magnifying-glass"></i></span><span class="result-ribbon"><span id="searchTotalCount">0</span> Result</span></h2>
    <div id="resultGrid" class="comic-grid"></div>

    <div id="pagination" class="pagination-container"></div>
</div>

<!-- Middle Banner -->
<div id="middlebanner-container"></div>

<!-- Bottom Banner -->
<div id="bottombanner-container"></div>

<!-- Sosial Bar Container -->
<div id="socialbar-container" class="socialbar-container"></div>

<div id="footer-placeholder"></div>

<script>
    function loadComponent(containerId, fileUrl) {
        fetch(fileUrl + '?t=' + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = data;
                
                if (fileUrl === 'topbanner.html' || fileUrl === 'middlebanner.html' || fileUrl === 'bottombanner.html') {
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                        if (oldScript.parentNode) oldScript.remove();
                    });
                }
            })
            .catch(error => {
                console.error(`Error loading ${fileUrl}:`, error);
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = '<div style="text-align:center; padding:10px; color:#ff3b6f;">Failed to load banner. Please check network.</div>';
                }
            });
    }

    function loadSocialBar() {
        fetch('sosialbar.html?t=' + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const container = document.getElementById('socialbar-container');
                if (!container) return;
                container.innerHTML = data;
                
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                    if (oldScript.parentNode) oldScript.remove();
                });
                
                console.log('Social bar loaded successfully');
            })
            .catch(error => {
                console.error('Error loading sosialbar.html:', error);
                const container = document.getElementById('socialbar-container');
                if (container) {
                    container.innerHTML = '<div style="text-align:center; padding:20px; background:#121212; border-radius:20px; border:1px solid #ff3b6f;">&#9888;&#65039; Gagal memuat Social Bar. Pastikan file sosialbar.html tersedia.</div>';
                }
            });
    }

    loadComponent('topbanner-container', 'topbanner.html');
    loadComponent('middlebanner-container', 'middlebanner.html');
    loadComponent('bottombanner-container', 'bottombanner.html');
    loadComponent('header-placeholder', 'header.html');
    loadComponent('footer-placeholder', 'footer.html');
    
    loadSocialBar();
</script>
<script src="search.js"></script>
<script src="tracker.js?v=4"></script>
