            margin-left: -30px;

            padding: 3px;

            font-weight: 700;

            border-bottom-right-radius: .3em;

        }
        .pagination-arrow {
            background: transparent;
            border: none;
            color: #fff;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;

            font-weight: 500;
        }
        .pagination-arrow:hover { color: #fff; background-color: #3b3737; }
        .pagination-arrow.disabled { opacity: 0.35; cursor: default; }
        .pagination-jump {
            width: 64px;
            background: transparent;
            border: none;
            border-bottom: 1px solid transparent;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            padding: 0 2px;
            outline: none;

        .pagination-label {
            cursor: text;
            padding: 5px 10px;

        }
        .pagination-info:hover .pagination-label { background: #3b3737; }
        .pagination-bar {
            display: inline-block;
            width: 2px;
            height: 11px;
            background: currentColor;
            vertical-align: 0px;
            margin: 0 2px;
        }
        .pagination-arrow { border: 1px solid #444; background: #111; }
        .pagination-arrow:hover { border-color: #ff0008; background-color: #3b3737; }
        .pagination-info {
