      .main-column-container {

        font-size: 16px; 
        text-transform: uppercase;
      }
/* ========= KONTEN UTAMA WRAPPER ========= */
      .main-content-wrapper {
        flex: 1;
        max-width: 1400px;
        margin: 0 auto;
        width: 100%;
        padding: 0 20px;
      }
      
      .gallery-container {
        text-align: center;
        margin-bottom: 25px;
        position: relative;
      }
      .page-title {
        font-size: 28px;
        font-weight: 800;
        background: linear-gradient(135deg, #ffa74e, #ff5e7c);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 15px;
        letter-spacing: 2px;
        position: relative;
        display: inline-block;
        padding-bottom: 10px;
      }
      .page-title::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 25%;
        width: 50%;
        height: 2px;
        background: linear-gradient(90deg, transparent, #ffa74e, #ff5e7c, transparent);
      }
      .page-title i {
        margin-right: 10px;
        color: #ffa74e;
        font-size: 28px;
      }
      
      #comic-gallery { 
        width: 100%; 
        max-width: 600px; 
        margin: 0 auto 20px; 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
      }
      #comic-gallery img { 
        width: 100% !important; 
        max-width: 565px;
        margin-bottom: 15px; 
        display: block; 
        background: #222; 
        border: 2px solid #333; 
        border-radius: 8px;
        cursor: pointer; 
        transition: all 0.2s;
        scroll-margin-top: 80px;
      }
      #comic-gallery img:hover {
        transform: scale(1.02);
        border-color: #ffa74e;
      }
      #comic-gallery img.highlight {
        border-color: #ffa74e;
        box-shadow: 0 0 20px rgba(255,167,78,0.8);
        transition: all 0.3s ease;
      }

      /* READER MODAL */
      #manga-reader {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #000;
        z-index: 9999;
        flex-direction: column;
      }
      #reader-top-bar, #reader-bottom-bar {
        background: #1a1a1a;
        min-height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 8px 15px;
        border-bottom: 1px solid #333;
        position: relative;
      }
      #reader-bottom-bar {
        border-bottom: none;
        border-top: 1px solid #333;
      }
      .nav-arrow {
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        padding: 6px 10px;
        cursor: pointer;
        transition: 0.2s;
      }
      .nav-arrow:hover {
        color: #ffa74e;
      }
      #page-counter {
        color: #fff;
        font-size: 16px;
        min-width: 110px;
        text-align: center;
      }
      .zoom-group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .zoom-btn {
        background: none;
        border: none;
        color: #fff;
        font-size: 22px;
        cursor: pointer;
        padding: 5px 8px;
        transition: 0.2s;
      }
      .zoom-btn:hover {
        color: #ffa74e;
      }
      .close-btn {
        position: absolute;
        left: 15px;
        background: none;
        border: none;
        color: #fff;
        font-size: 26px;
        cursor: pointer;
        z-index: 11;
        transition: 0.2s;
      }
      .close-btn:hover {
        color: #ffa74e;
      }
      .zoom-group {
        position: absolute;
        right: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #reader-content {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
        background: #000;
        padding-top: 10px;
      }
      #reader-image {
        max-width: 100%;
        max-height: 100%;
        cursor: pointer;
        padding-bottom: 10px;
        transition: transform 0.3s ease;
        transform-origin: top center;
      }

      /* ========= FOOTER – DIHAPUS ========= */

      @media (max-width: 600px) {
        .zoom-group { display: none; }
        .nav-arrow { font-size: 20px; padding: 4px 8px; }
        #page-counter, #page-counter-bottom { font-size: 14px; min-width: 85px; }
        #reader-top-bar, #reader-bottom-bar { gap: 8px; padding: 8px 12px; }
        .page-title { font-size: 22px; }
        .page-title i { font-size: 22px; }
        .main-content-wrapper { padding: 0 15px; }
      }
      
      @media (max-width: 480px) {

  <script>
    // Fungsi untuk memuat konten dari file eksternal ke dalam container
    function loadComponent(containerId, fileUrl) {
        fetch(fileUrl + '?t=' + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = data;
                
                // Jika yang dimuat adalah file banner, jalankan script iklan yang ada di dalamnya
                if (fileUrl === 'topbanner.html' || fileUrl === 'middlebanner.html' || fileUrl === 'bottombanner.html') {
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                        if (oldScript.parentNode) oldScript.remove();
                    });
                }
            })
            .catch(error => {
                console.error(`Error loading ${fileUrl}:`, error);
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = '<div style="text-align:center; padding:10px; color:#ff3b6f;">Failed to load banner. Please check network.</div>';
                }
            });
    }

    // Fungsi untuk memuat sosial bar dari file sosialbar.html
    function loadSocialBar() {
        fetch('sosialbar.html?t=' + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const container = document.getElementById('socialbar-container');
                if (!container) return;
                container.innerHTML = data;
                
                // Jalankan semua script yang ada di dalam sosialbar.html
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                    if (oldScript.parentNode) oldScript.remove();
                });
                
                console.log('Social bar loaded successfully');
            })
            .catch(error => {
                console.error('Error loading sosialbar.html:', error);
                const container = document.getElementById('socialbar-container');
                if (container) {
                    container.innerHTML = '<div style="text-align:center; padding:20px; background:#121212; border-radius:20px; border:1px solid #ff3b6f;">⚠️ Gagal memuat Social Bar. Pastikan file sosialbar.html tersedia.</div>';
                }
            });
    }

    // Memuat Top Banner, Middle Banner, Bottom Banner, Header, dan Footer
    loadComponent('topbanner-container', 'topbanner.html');
    loadComponent('middlebanner-container', 'middlebanner.html');
    loadComponent('bottombanner-container', 'bottombanner.html');
    loadComponent('header-placeholder', 'header.html');
    loadComponent('footer-placeholder', 'footer.html');
    
    // Memuat sosial bar dari file sosialbar.html
    loadSocialBar();
</script>
