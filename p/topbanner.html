<style>
    .ads-container-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        width: 100%;
        margin: 15px 0;
    }
    .ads-unit-small {
        width: 320px;
        height: 50px;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }
</style>

<div class="ads-container-row" id="ads-container"></div>

<script>
    const iklanKey = '1f10a9d53612a8c49203598bffed7c49';
    const container = document.getElementById('ads-container');
    
    function getJumlahIklan() {
        const w = window.innerWidth;
        if (w >= 1285) return 4;
        if (w >= 1080) return 3;
        if (w >= 545) return 2;
        return 1;
    }
    
    function buatIklan() {
        container.innerHTML = '';
        const jumlah = getJumlahIklan();
        for (let i = 0; i < jumlah; i++) {
            const adDiv = document.createElement('div');
            adDiv.className = 'ads-unit-small';
            const iframe = document.createElement('iframe');
            iframe.width = '320';
            iframe.height = '50';
            iframe.style.border = 'none';
            iframe.style.overflow = 'hidden';
            iframe.scrolling = 'no';
            adDiv.appendChild(iframe);
            container.appendChild(adDiv);
            const iframeContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { margin: 0; padding: 0; width: 320px; height: 50px; overflow: hidden; background: transparent; }
                    </style>
                </head>
                <body>
                    <script>
                        atOptions = {
                            'key' : '${iklanKey}',
                            'format' : 'iframe',
                            'height' : 50,
                            'width' : 320,
                            'params' : {}
                        };
                    <\/script>
                    <script src="https://rhubarbambassadorweep.com/${iklanKey}/invoke.js"><\/script>
                </body>
                </html>
            `;
            const iframeDoc = iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(iframeContent);
            iframeDoc.close();
        }
    }
    
    buatIklan();
    window.addEventListener('resize', buatIklan);
</script>
