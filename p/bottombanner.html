<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .ads-bottomcontainer-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin: 20px 0;
        }
        .ads-unit-bottom {
            width: 300px;
            height: 250px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="ads-bottomcontainer-row" id="ads-bottomcontainer"></div>

    <script>
        (function() {
            const iklanKey = '5919fac96c79e892c7af2afe9607956a';
            const container = document.getElementById('ads-bottomcontainer');
            if (!container) return;
            
            function getJumlahIklan() {
                const w = window.innerWidth;
                if (w >= 1285) return 4;
                if (w >= 1080) return 3;
                if (w >= 545) return 2;
                return 1;
            }
            
            function buatIklan() {
                container.innerHTML = '';
                const jumlah = getJumlahIklan();
                for (let i = 0; i < jumlah; i++) {
                    const adDiv = document.createElement('div');
                    adDiv.className = 'ads-unit-bottom';
                    const iframe = document.createElement('iframe');
                    iframe.width = '300';
                    iframe.height = '250';
                    iframe.style.border = 'none';
                    iframe.style.overflow = 'hidden';
                    iframe.scrolling = 'no';
                    adDiv.appendChild(iframe);
                    container.appendChild(adDiv);
                    const iframeContent = `
                        <!DOCTYPE html>
                        <html>
                        <head>
                            <meta charset="UTF-8">
                            <style>
                                body { margin: 0; padding: 0; width: 300px; height: 250px; overflow: hidden; background: transparent; }
                            </style>
                        </head>
                        <body>
                            <script>
                                atOptions = {
                                    'key' : '${iklanKey}',
                                    'format' : 'iframe',
                                    'height' : 250,
                                    'width' : 300,
                                    'params' : {}
                                };
                            <\/script>
                            <script src="https://rhubarbambassadorweep.com/${iklanKey}/invoke.js"><\/script>
                        </body>
                        </html>
                    `;
                    const iframeDoc = iframe.contentWindow.document;
                    iframeDoc.open();
                    iframeDoc.write(iframeContent);
                    iframeDoc.close();
                }
            }
            
            buatIklan();
            window.addEventListener('resize', buatIklan);
        })();
    </script>
</body>
</html>
