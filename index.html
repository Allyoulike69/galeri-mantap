    <style>
        /* RESET & GLOBAL */
        * { box-sizing: border-box; }
        body {
            background: #000000;
            color: #fff;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            overflow-x: hidden;
            scrollbar-gutter: stable;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }


        /* KONTEN UTAMA: dibatasi lebar maksimal + margin kiri/kanan untuk iklan */
        .main-content-container {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 15px;
            width: 100%;
            flex: 1;
        }

        /* FOOTER SEDERHANA */
        .main-footer {
            background: #0a0a0a;
            border-top: 1px solid #222;
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            width: 100%;
        }
        .footer-text {
            color: #777;
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .footer-text i {
            color: #ff5e7c;
            margin: 0 2px;
        }
        .footer-text a {
            color: #ffa74e;
            text-decoration: none;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }

        /* GRID */
        .section-title {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 20px;
            font-weight: bold;
        }
        .section-title .title-ribbon {
            background: #b80006;
            color: #fff;
            padding: 5px 25px 5px 10px;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 100% 100%, 0 100%, 0px 50%);
            white-space: nowrap;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: #b80006;
        }
        .comic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 5px;
            margin-bottom: 30px;
            background-color: #292b2b;
            padding: 10px;
        }
        @media (min-width: 768px) {
            .comic-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
        
        .header-title {
            color: #eee;
            font-size: 22px;
            font-weight: bold;
            margin: 0;
        }
        .color-icon { color: #ff2d55; font-size: 24px; }
        
        .comic-item {
            background: #000000;
            border-radius: 5px;
            border: 1px solid #333;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
            padding-bottom: 30px;
        }
        .comic-item:hover {
            border-color: #ff0008;
            border-radius: 5px;
            z-index: 100;
            color: #ff0008;
            background: #1a1a1a;
        }
        .comic-thumb-container { aspect-ratio: 2/3; overflow: hidden; background: #222; border-radius: 5px 5px 0 0; }
        .comic-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .comic-title {
            position: absolute;
            background-color: #000000;
            border-radius: 0 0 5px 5px;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0 3px 3px;
            text-align: center;
            color: #ff0008;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .comic-item:hover .comic-title {
            color: #ff0008;
            background: #1a1a1a;
            border: 1px solid #ff0008;
            border-top: none;
            border-radius: 0 0 5px 5px;
            padding: 0 3px 3px;
            margin: 0 -1px;
        }
        
        .badge {
            position: absolute;
            top: 8px;
            left: -4px;
            padding: 5px 15px 5px 10px;
            font-size: 10px;
            font-weight: 900;
            color: white;
            z-index: 1;
            background: rgba(0, 0, 0, 0.8);
            clip-path: polygon(0 0, 100% 0, 75% 100%, 100% 100%, 0 100%, 0px 50%);
        }
        .badge-new { background: #b80006; }
        
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        .pagination-btn, .pagination-arrow {
            background: transparent;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
        }
        .pagination-btn.active { color: #ffffff; font-weight: bold; background-color: #ff0008; }
        .pagination-btn:hover, .pagination-arrow:hover { color: #fff; background-color: #3b3737; }
        .pagination-arrow.disabled { display: none; }
        .pagination-dots { color: #888; padding: 8px 4px; font-size: 14px; }
        
        @media (max-width: 768px) {
            .main-content-container { padding: 0 16px; }
        }
        @media (max-width: 480px) {
            .main-content-container { padding: 0 12px; }
        }
        
        @media (min-width: 769px) {
            .main-content-container {
            max-width: 1200px;
                margin: 0 auto;
                padding: 0 20px;
            }
        }
        
        /* TEMPORARY HIDDEN UNTUK HEADER YANG AKAN DIISI */
        #header-placeholder {
            width: 100%;
        }
    </style>

</head>
<body>

<!-- Top Banner -->

<div class="main-content-container">

    <h2 class="section-title"><span class="title-ribbon">Recomend</span></h2>
    <div id="recomend-grid" class="comic-grid"></div>
    
    <h2 class="section-title"><span class="title-ribbon">New Upload</span></h2>

    <div id="pagination" class="pagination-container"></div>
    
    <!-- Bottom Banner -->
    
</div>

 <!-- Middle Banner -->
    <div id="middlebanner-container"></div>

<div id="bottombanner-container"></div>

<!-- Sosial Bar Container -->
<div id="socialbar-container" class="socialbar-container"></div>

<div id="footer-placeholder"></div>

<script>
    // Fungsi untuk memuat konten dari file eksternal ke dalam container
    function loadComponent(containerId, fileUrl) {
        fetch(fileUrl + '?t=' + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const container = document.getElementById(containerId);
                if (!container) return;
                container.innerHTML = data;
                
                // Jika yang dimuat adalah file banner, jalankan script iklan yang ada di dalamnya
                if (fileUrl === 'topbanner.html' || fileUrl === 'middlebanner.html' || fileUrl === 'bottombanner.html') {
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(oldScript => {
                        const newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                        if (oldScript.parentNode) oldScript.remove();
                    });
                }
            })
            .catch(error => {
                console.error(`Error loading ${fileUrl}:`, error);
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = '<div style="text-align:center; padding:10px; color:#ff3b6f;">Failed to load banner. Please check network.</div>';
                }
            });
    }

    // Fungsi untuk memuat sosial bar dari file sosialbar.html
    function loadSocialBar() {
        fetch('sosialbar.html?t=' + Date.now())
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(data => {
                const container = document.getElementById('socialbar-container');
                if (!container) return;
                container.innerHTML = data;
                
                // Jalankan semua script yang ada di dalam sosialbar.html
                const scripts = container.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                    if (oldScript.parentNode) oldScript.remove();
                });
                
                console.log('Social bar loaded successfully');
            })
            .catch(error => {
                console.error('Error loading sosialbar.html:', error);
                const container = document.getElementById('socialbar-container');
                if (container) {
                    container.innerHTML = '<div style="text-align:center; padding:20px; background:#121212; border-radius:20px; border:1px solid #ff3b6f;">⚠️ Gagal memuat Social Bar. Pastikan file sosialbar.html tersedia.</div>';
                }
            });
    }

    // Memuat Top Banner, Middle Banner, Bottom Banner, Header, dan Footer
    loadComponent('topbanner-container', 'topbanner.html');
    loadComponent('middlebanner-container', 'middlebanner.html');
    loadComponent('bottombanner-container', 'bottombanner.html');
    loadComponent('header-placeholder', 'header.html');
    loadComponent('footer-placeholder', 'footer.html');
    
    // Memuat sosial bar dari file sosialbar.html
    loadSocialBar();
</script>
