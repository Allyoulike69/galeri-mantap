<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Format Gambar → id-comic.json</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 600px at 50% -100px, #221016 0%, #0a0a0a 55%) fixed, #0a0a0a;
    color: #eee; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px;
  }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 22px; letter-spacing: .5px; padding-left: 10px; border-left: 4px solid #f10000; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .topnav { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 0; margin: 14px 0 4px; border-bottom: 1px solid #222; }
  .topnav button { margin: 0; }
  .topnav.links a {
    background: linear-gradient(180deg, #262626, #1b1b1b);
    border: 1px solid #3a3a3a; color: #fff; text-decoration: none;
    padding: 9px 16px; border-radius: 5px; font-size: 14px; font-weight: 600;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .topnav.links a:hover { border-color: #f10000; box-shadow: 0 0 12px rgba(241,0,0,.35); transform: translateY(-1px); }
  .topnav.links a.red { background: linear-gradient(180deg, #ff2b2b, #c80000); border-color: #ff2b2b; }
  .topnav.links a.red:hover { box-shadow: 0 0 14px rgba(241,0,0,.5); }
  .panel { border: 1px solid #333; border-radius: 14px; background: rgba(255,255,255,.015); padding: 6px 18px 22px; margin-top: 4px; }
  label { display: block; margin: 14px 0 6px; font-weight: 700; color: #ddd; }
  input[type=text], textarea, select {
    width: 100%; background: #141414; border: 1px solid #333; color: #fff;
    border-radius: 8px; padding: 10px; font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, textarea:focus, select:focus {
    outline: none; border-color: #f10000; box-shadow: 0 0 10px rgba(241,0,0,.25);
  }
  textarea { min-height: 160px; font-family: monospace; }
  .row { display: flex; gap: 10px; }
  .row > div { flex: 1; }
  button {
    background: linear-gradient(180deg, #ff2b2b, #c80000); border: 1px solid #ff2b2b;
    color: #fff; padding: 10px 20px;
    font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer; margin: 10px 5px 0 0;
    transition: box-shadow .15s, transform .15s;
  }
  button:hover { box-shadow: 0 0 12px rgba(241,0,0,.4); transform: translateY(-1px); }
  button.ghost { background: linear-gradient(180deg, #2a2a2a, #1d1d1d); border: 1px solid #3a3a3a; }
  button.ghost:hover { border-color: #f10000; box-shadow: 0 0 10px rgba(241,0,0,.25); }
  pre {
    background: #141414; border: 1px solid #2a2a2a; border-radius: 12px;
    padding: 12px; white-space: pre-wrap; word-break: break-all; font-size: 13px;
  }
  .info { color: #ffa74e; font-size: 14px; }
  .warn { color: #ff5555; font-size: 14px; font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>Format Gambar → id-comic.json</h1>
  </div>
  <nav class="topnav links">
    <a href="dash/index.html">Home</a>
    <a href="index.html" target="_blank" rel="noopener">Lihat Situs</a>
    <a href="dash/statistik.html" target="_blank" rel="noopener">Dashboard Statistik</a>
    <a href="format-comic.html" target="_blank" rel="noopener">Format Comic</a>
    <a class="red" href="format-gambar.html">Format Gambar</a>
  </nav>
  <div class="panel">
  <p class="info">Tempel daftar URL gambar (1 baris 1 URL, tanpa koma tanpa kutip) → otomatis jadi entry siap tempel.</p>

  <label for="selFile">File target</label>
  <select id="selFile">
    <option value="id-comic.json">id-comic.json</option>
    <option value="id-comic2.json">id-comic2.json</option>
    <option value="id-comic3.json">id-comic3.json</option>
    <option value="id-comic4.json">id-comic4.json</option>
    <option value="id-comic5.json">id-comic5.json</option>
  </select>
  <div id="fileInfo" class="info"></div>

  <div class="row">
    <div>
      <label for="inCode">Code</label>
      <input type="text" id="inCode" value="#" placeholder="#">
    </div>
    <div>
      <label for="inLengkap">Lengkap</label>
      <select id="inLengkap">
        <option value="-" selected>- (sembunyi)</option>
        <option value="yes">yes (tampil)</option>
      </select>
    </div>
  </div>

  <label for="inUrls">Daftar URL gambar</label>
  <textarea id="inUrls" placeholder="https://i.ibb.co.com/xxx/1t.webp&#10;https://i.ibb.co.com/xxx/2t.webp&#10;..."></textarea>
  <div id="statUrl" class="info"></div>
  <div id="warnUrl" class="warn"></div>
  <div id="dupInfo" class="warn"></div>

  <label>Hasil (siap tempel ke id-comic.json)</label>
  <pre id="outEntry">...</pre>
  <button id="btnCopy">Salin Entry</button>
  <button id="btnClear" class="ghost">Hapus Semua</button>
  <span id="copyMsg" class="info"></span>
  </div>

</div>

<script>
  var inCode = document.getElementById('inCode');
  var inLengkap = document.getElementById('inLengkap');
  var inUrls = document.getElementById('inUrls');
  var outEntry = document.getElementById('outEntry');
  var statUrl = document.getElementById('statUrl');
  var warnUrl = document.getElementById('warnUrl');
  var copyMsg = document.getElementById('copyMsg');
  var selFile = document.getElementById('selFile');
  var fileInfo = document.getElementById('fileInfo');
  var dupInfo = document.getElementById('dupInfo');
  var current = [];

  function loadFile() {
    copyMsg.textContent = '';
    var name = selFile.value;
    fileInfo.textContent = 'memuat ' + name + ' ...';
    fetch('p/' + name + '?t=' + Date.now())
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(data) {
        var arr = data['raw-links'] || data.pages || data;
        current = Array.isArray(arr) ? arr : [];
        fileInfo.textContent = name + ': ' + current.length + ' entri.';
        render();
      })
      .catch(function(err) {
        current = [];
        fileInfo.textContent = name + ' gagal dimuat (' + err.message + ') — cek duplikat nonaktif.';
        render();
      });
  }

  function parseUrls() {
    var parts = inUrls.value.split(/\s+/);
    var urls = [];
    var bad = 0;
    for (var i = 0; i < parts.length; i++) {
      var u = parts[i].trim().replace(/,$/, '');
      if (!u) continue;
      if (/^https?:\/\//i.test(u)) urls.push(u);
      else bad++;
    }
    return { urls: urls, bad: bad };
  }

  function render() {
    var r = parseUrls();
    statUrl.textContent = r.urls.length + ' URL terdeteksi';
    warnUrl.textContent = r.bad > 0 ? (r.bad + ' baris bukan URL (diabaikan)') : '';
    var myCode = inCode.value.trim();
    var dup = false;
    if (myCode) {
      for (var di = 0; di < current.length; di++) {
        if (((current[di] && current[di].code) || '').trim() === myCode) { dup = true; break; }
      }
    }
    dupInfo.textContent = dup ? ('PERINGATAN: code ' + myCode + ' SUDAH ADA di ' + selFile.value) : '';
    var entry = '                {\n'
      + '                   "code":  "' + inCode.value.trim() + '",\n'
      + '                   "picture":  "' + r.urls.join(' ') + '",\n'
      + '                   "lengkap":  "' + inLengkap.value + '"\n'
      + '                }';
    outEntry.textContent = entry;
    return entry;
  }

  inCode.addEventListener('input', render);
  inLengkap.addEventListener('change', render);
  inUrls.addEventListener('input', render);
  render();

  document.getElementById('btnCopy').addEventListener('click', function() {
    var txt = render();
    function done() { copyMsg.textContent = 'tersalin! Tempel ke id-comic.json'; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function() { fallback(); });
    } else { fallback(); }
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  });

  document.getElementById('btnClear').addEventListener('click', function() {
    inUrls.value = '';
    copyMsg.textContent = '';
    render();
  });

  selFile.addEventListener('change', loadFile);
  loadFile();
</script>
</body>
</html>
