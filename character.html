<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

    <meta name="description" content="ComicYouLike - Free Hentai Manga, Daujinshi and Anime Porn">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            background: #000000; color: #fff; margin: 0; padding: 0;
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            overflow-x: hidden; scrollbar-gutter: stable;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        #header-placeholder { min-height: 60px; }
        .main-content-container {
            max-width: 960px; margin: 20px auto; padding: 0 15px;
            width: 100%; flex: 1;
        }
        .section-title {
            display: flex; align-items: center; justify-content: center;
            margin: 10px 0; font-size: 20px; font-weight: bold;
        }
        .section-title .title-ribbon {
            background: #b80006; color: #fff;
            padding: 5px 25px 5px 10px;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 100% 100%, 0 100%, 0px 50%);
            white-space: nowrap;
        }
        .section-title .tag-name-ribbon {
            background: #3c3f38; color: #fff;
            padding: 5px 30px 5px 30px;
            white-space: nowrap;
            margin: 0px 0px 0px -40px;
            font-size: 20px;
        }
        .section-title .tag-count-ribbon {
            background: #555; color: #fff;
            padding: 5px 10px 5px 25px;
            clip-path: polygon(100% 0, 100% 50%, 100% 100%, 0 100%, 40% 0);
            white-space: nowrap;
            font-size: 20px;
            margin-left: -30px;
        }
        .comic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 5px; margin-bottom: 30px;
            background-color: #292b2b; padding: 10px;
        }
        @media (min-width: 768px) {
            .comic-grid { grid-template-columns: repeat(5, 1fr); }
        }
        .comic-item {
            background: #000000; border-radius: 5px;
            border: 1px solid #333;
            transition: transform 0.2s, border-color 0.2s;
            position: relative; padding-bottom: 30px;
        }
        .comic-item:hover {
            border-color: #ff0008; border-radius: 5px; z-index: 100;
            color: #ff0008; background: #000000;
        }
        .comic-thumb-container { aspect-ratio: 2/3; overflow: hidden; background: #222; border-radius: 5px 5px 0 0; }
        .comic-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .comic-title {
            position: absolute; background-color: #000000;
            border-radius: 0 0 5px 5px; left: 0; right: 0; bottom: 0;
            padding: 0 3px 3px; text-align: center; color: #ff0008;
            text-decoration: none; font-size: 12px; font-weight: bold;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .comic-item:hover .comic-title {
            color: #ff0008;
            background: #1a1a1a; border: 1px solid #ff0008; border-top: none;
            border-radius: 0 0 5px 5px; padding: 0 3px 3px; margin: 0 -1px;
        }
        .pagination-container {
            display: flex; justify-content: center; align-items: center;
            gap: 3px; margin: 30px 0; flex-wrap: wrap;
        }
        .pagination-btn, .pagination-arrow {
            background: transparent; border: none; color: white;
            padding: 8px 14px; border-radius: 5px; cursor: pointer;
            transition: all 0.2s; font-size: 14px; font-weight: 500;
        }
        .pagination-btn.active { color: #ffffff; font-weight: bold; background-color: #ff0008; }
        .pagination-btn:hover, .pagination-arrow:hover { color: #fff; background-color: #3b3737; }
        .pagination-arrow.disabled { display: none; }
        .pagination-dots { color: #888; padding: 8px 4px; font-size: 14px; }
        .loading { text-align: center; padding: 40px; color: #888; font-size: 15px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #888; font-size: 18px; }
        .main-footer {
            background: #0a0a0a; border-top: 1px solid #222;
            margin-top: 40px; padding: 20px; text-align: center; width: 100%;
        }
        .footer-text { color: #777; font-size: 13px; }
        @media (max-width: 600px) {
            .comic-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 5px; }
        }
    </style>
</head>
<body>
<div id="header-placeholder"></div>
<!-- Top Banner -->
<div id="topbanner-container"></div>
<div class="main-content-container">
    <h2 class="section-title"><span class="title-ribbon">Character</span><span class="tag-name-ribbon" id="tagTitle"></span><span class="tag-count-ribbon" id="tagCount"></span></h2>
    <div id="comic-grid" class="comic-grid"><div class="loading">Loading...</div></div>
</div>
<div id="pagination" class="pagination-container"></div>
<!-- Middle Banner -->
<div id="middlebanner-container"></div>
<!-- Bottom Banner -->
<div id="bottombanner-container"></div>
<div id="socialbar-container" class="socialbar-container"></div>
<div id="footer-placeholder"></div>
