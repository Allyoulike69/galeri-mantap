<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Statistik - ComicYouLike</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        * { box-sizing: border-box; }
        body {
            background: radial-gradient(1200px 600px at 50% -100px, #221016 0%, #0a0a0a 55%) fixed, #0a0a0a;
            color: #eee;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
        }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .page-title h1 {
            font-size: 26px;
            color: #fff;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-title h1 i { color: #f10000; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f10000;
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 9px 18px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: #c80000; }
        .btn.ghost { background: #1a1a1a; border: 1px solid #333; }
        .btn.ghost:hover { background: #222; }
        .nav-tabs a { padding:8px 16px;border-radius:5px;font-size:13px;font-weight:700;text-decoration:none;background:#111;color:#aaa;border:1px solid #333; }
        .nav-tabs a.active { background:#f10000;color:#fff;border-color:#f10000; }
        .range-pick { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .range-pick label {
            font-size: 25px;
            color: #eee;
            font-weight: 700;
        }
        .range-pick select {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            outline: none;
            transition: border-color 0.15s;
        }
        .range-pick select:hover, .range-pick select:focus { border-color: #f10000; }
        .range-pick select option { background: #141414; color: #fff; }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 26px;
        }
        .card {
            background: linear-gradient(180deg, #181818, #111);
            border: 1px solid #2c2c2c;
            border-top: 3px solid #f10000;
            border-radius: 12px;
            padding: 16px 18px;
        }
        .card .label {
            font-size: 12px;
            color: #999;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .card .label i { color: #f10000; }
        .card .num { font-size: 30px; font-weight: 800; color: #ffa74e; }
        .card.hl { border-color: #f10000; }
        .panel {
            background: #141414;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 22px;
        }
        .panel h2 {
            font-size: 16px;
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel h2 i { color: #f10000; }
        .bar-chart { min-width: 100%; width: 100%; display:block; }
        .bar-chart svg { display:block; max-width:none; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #f10000; }
        th { color: #ffa74e; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        td.num { font-weight: 700; }
        tr:hover td { background: #161616; }
        .rank { color: #ff3b6f; font-weight: 800; width: 40px; }
        .loading, .empty { text-align: center; color: #888; padding: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr; gap: 22px; }
        @media (min-width: 900px) { .grid-2 { grid-template-columns: 1fr 1fr; align-items: start; } }
        .bar-wrap { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .bar-wrap::-webkit-scrollbar { height: 8px; }
        .bar-wrap::-webkit-scrollbar-thumb { background:#3a3a3a; border-radius:4px; }
        .bar-wrap::-webkit-scrollbar-thumb:hover { background:#f10000; }
        .table-scroll {
            max-height: 340px;
            overflow-y: auto;
            margin-top: 8px;
            border: 1px solid #262626;
            border-radius: 8px;
        }
        .table-scroll table { margin: 0; }
        .table-scroll thead th {
            position: sticky;
            top: 0;
            background: #141414;
            z-index: 1;
        }
        .table-scroll::-webkit-scrollbar { width: 8px; }
        .table-scroll::-webkit-scrollbar-track { background: #0d0d0d; }
        .table-scroll::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
        .table-scroll::-webkit-scrollbar-thumb:hover { background: #f10000; }
        .modal { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; }
        .modal-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.7); }
        .modal-content { position:relative; background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:0; width:90%; max-width:420px; animation:slideUp 0.2s ease; }
        @keyframes slideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid #333; }
        .modal-header h3 { margin:0; font-size:16px; color:#fff; display:flex; align-items:center; gap:8px; }
        .modal-header h3 i { color:#f10000; }
        .modal-close { background:none; border:none; color:#888; font-size:24px; cursor:pointer; line-height:1; padding:0; }
        .modal-close:hover { color:#fff; }
        .modal-body { padding:20px; }
        .date-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
        .date-row label { display:block; font-size:12px; color:#888; margin-bottom:6px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
        .date-row input { width:100%; background:#0d0d0d; border:1px solid #333; color:#fff; border-radius:6px; padding:10px 12px; font-size:14px; }
        .date-row input:focus { outline:none; border-color:#f10000; }
        .quick-picks { display:flex; gap:8px; flex-wrap:wrap; }
        .quick-btn { background:#1a1a1a; border:1px solid #333; color:#fff; border-radius:20px; padding:6px 14px; font-size:12px; font-weight:700; cursor:pointer; transition:all 0.15s; }
        .quick-btn:hover { border-color:#f10000; background:#222; }
        .modal-footer { display:flex; justify-content:flex-end; gap:10px; padding:16px 20px; border-top:1px solid #333; }
    </style>
</head>
<body>

<div class="wrap">
    <div class="page-title">
        <h1><i class="fa-solid fa-chart-simple"></i> Dashboard Statistik</h1>
    </div>
    <div class="nav-tabs" style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap">
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="statistik.html" class="active"><i class="fa-solid fa-chart-simple"></i> Kunjungan</a>
        <a href="comic.html"><i class="fa-solid fa-book-open"></i> Comic</a>
    </div>

    <div class="range-pick" style="flex-wrap:wrap;">
        <label><i class="fa-solid fa-calendar-days"></i> Rentang Waktu</label>
        <select id="rangeSelect" aria-label="Rentang waktu"></select>
        <span id="lastUpdate" style="font-size:12px;color:#888;margin-left:auto;display:inline-flex;align-items:center;gap:6px;"><i class="fa-solid fa-circle" style="color:#22c55e;font-size:8px;animation:pulse 1.5s infinite;"></i> Auto-update 30s</span>
    </div>
    <style>@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}</style>

    <div id="customRangeModal" class="modal" style="display:none;">
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-calendar-days"></i> Rentang Kustom</h3>
                <button type="button" class="modal-close" aria-label="Tutup">&times;</button>
            </div>
            <div class="modal-body">
                <div class="date-row">
                    <div>
                        <label>Dari</label>
                        <input type="date" id="customStartDate">
                    </div>
                    <div>
                        <label>Sampai</label>
                        <input type="date" id="customEndDate">
                    </div>
                </div>
                <div class="quick-picks">
                    <button type="button" data-days="1" class="quick-btn">Hari Ini</button>
                    <button type="button" data-days="7" class="quick-btn">7 Hari</button>
                    <button type="button" data-days="30" class="quick-btn">30 Hari</button>
                    <button type="button" data-days="90" class="quick-btn">3 Bulan</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn ghost" id="customCancel">Batal</button>
                <button type="button" class="btn" id="customApply">Terapkan</button>
            </div>
        </div>
    </div>

    <div class="cards">
        <div class="card hl"><div class="label"><i class="fa-solid fa-eye"></i> Hari Ini</div><div class="num" id="statToday">&ndash;</div></div>
        <div class="card"><div class="label"><i class="fa-regular fa-calendar"></i> Kemarin</div><div class="num" id="statYesterday">&ndash;</div></div>
        <div class="card"><div class="label"><i class="fa-solid fa-calendar-week"></i> 7 Hari</div><div class="num" id="statWeek">&ndash;</div></div>
        <div class="card"><div class="label"><i class="fa-solid fa-users"></i> Total</div><div class="num" id="statTotal">&ndash;</div></div>
    </div>

    <div class="panel">
        <h2><i class="fa-solid fa-chart-column"></i> Rentang: <span id="rngTitle">-</span></h2>
        <div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:18px;">
            <div class="card"><div class="label"><i class="fa-solid fa-hashtag"></i> Total Rentang</div><div class="num" id="rngTotal">&ndash;</div></div>
            <div class="card"><div class="label"><i class="fa-solid fa-divide"></i> <span id="rngAvgLbl">Rata-rata / hari</span></div><div class="num" id="rngAvg">&ndash;</div></div>
            <div class="card"><div class="label"><i class="fa-solid fa-fire"></i> <span id="rngPeakLbl">Hari Tersibuk</span></div><div class="num" id="rngPeak" style="font-size:18px;">&ndash;</div></div>
        </div>
        <div class="bar-wrap"><div class="bar-chart" id="chart"><div class="loading"><i class="fa-solid fa-spinner fa-pulse"></i> Menghitung...</div></div></div>
        <div class="table-scroll">
            <table>
                <thead><tr><th>Periode</th><th>Kunjungan</th></tr></thead>
                <tbody id="dayTable"></tbody>
            </table>
        </div>
        </div>

</div>

<script src="../tracker.js?v=1"></script>
<script src="stats.js?v=14"></script>
</body>
</html>
