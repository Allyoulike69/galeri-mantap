<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Dashboard Comic - ComicYouLike</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        *{box-sizing:border-box}
        body{background:radial-gradient(1200px 600px at 50% -100px, #221016 0%, #0a0a0a 55%) fixed, #0a0a0a;color:#eee;margin:0;padding:0;font-family:'Segoe UI','Poppins',system-ui,sans-serif}
        .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
        .page-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
        .page-title h1{font-size:26px;color:#fff;margin:0;display:flex;align-items:center;gap:10px}
        .page-title h1 i{color:#f10000}
        .nav-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
        .nav-tabs a{padding:8px 16px;border-radius:5px;font-size:13px;font-weight:700;text-decoration:none;border:1px solid #333}
        .nav-tabs a.active{background:#f10000;color:#fff;border-color:#f10000}
        .nav-tabs a:not(.active){background:#111;color:#aaa}
        .nav-tabs a:not(.active):hover{border-color:#f10000;color:#fff}
        .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
        .toolbar input{background:#111;border:1px solid #333;color:#fff;border-radius:6px;padding:9px 12px;font-size:13px;flex:1;min-width:200px}
        .toolbar input:focus{outline:none;border-color:#f10000}
        .toolbar select{background:#111;border:1px solid #333;color:#fff;border-radius:6px;padding:9px 12px;font-size:13px}
        .btn{display:inline-flex;align-items:center;gap:6px;background:#f10000;color:#fff;border:none;border-radius:30px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}
        .btn:hover{background:#c80000}
        .btn.ghost{background:#1a1a1a;border:1px solid #333}
        .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
        .card{background:linear-gradient(180deg,#181818,#111);border:1px solid #2c2c2c;border-top:3px solid #f10000;border-radius:12px;padding:16px 18px}
        .card .label{font-size:11px;color:#999;letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
        .card .label i{color:#f10000}
        .card .num{font-size:26px;font-weight:800;color:#ffa74e}
        .card.hl{border-color:#f10000}
        .panel{background:#141414;border:1px solid #333;border-radius:12px;padding:16px 18px;margin-bottom:18px}
        .panel h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:#fff}
        .panel h2 i{color:#f10000}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th,td{padding:9px 10px;text-align:left;border-bottom:1px solid #222}
        th{color:#f10000;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;white-space:nowrap}
        td.num{font-weight:700}
        tr:hover td{background:#161616}
        .rank{color:#ff3b6f;font-weight:800;width:36px}
        .loading,.empty{text-align:center;color:#888;padding:18px}
        .genre-grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-start}
        .dashboard-item{flex:0 0 calc((100% - 24px)/3);width:calc((100% - 24px)/3);display:flex;flex-direction:row;gap:10px;align-items:center;background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:10px;transition:border-color 0.2s;min-width:0}
        .dashboard-item:hover{border-color:#f10000}
        .dashboard-thumb-container{flex:0 0 90px;width:90px;aspect-ratio:2/3;overflow:hidden;background:#222;border-radius:5px;position:relative}
        .video-thumb{width:100%;height:100%;object-fit:cover;display:block}
        .dashboard-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
        .dashboard-rank{font-size:11px;font-weight:800;color:#ff3b6f;letter-spacing:0.5px}
        .dashboard-title{font-weight:800;font-size:13px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
        .dashboard-title a{color:#fff;text-decoration:none}
        .dashboard-title a:hover{color:#f10000}
        .dashboard-count{font-size:11px;font-weight:700;color:#ccc;display:flex;align-items:center;gap:5px}
        .dashboard-count i{color:#f10000;width:12px;text-align:center;font-size:11px}
        .dashboard-count strong{color:#fff}
        @media(max-width:900px){.dashboard-item{flex:0 0 calc((100% - 12px)/2);width:calc((100% - 12px)/2)}}
        @media(max-width:500px){.dashboard-item{flex:0 0 100%;width:100%}}
    </style>
</head>
<body>
<div class="wrap">
    <div class="page-title">
        <h1><i class="fa-solid fa-book-open"></i> Dashboard Comic</h1>
        <span id="lastUpdate" style="margin-left:auto;font-size:12px;color:#888;display:inline-flex;align-items:center;gap:6px;">Update: -</span>
    </div>
    <div class="nav-tabs">
        <a href="index.html"><i class="fa-solid fa-house"></i> Home</a>
        <a href="statistik.html"><i class="fa-solid fa-chart-simple"></i> Kunjungan</a>
        <a class="active" href="comic.html"><i class="fa-solid fa-book-open"></i> Comic</a>
    </div>

    <!-- ringkasan dihapus -->

    <div class="panel">
        <h2><i class="fa-solid fa-table-list"></i> Semua Comic <span id="comicPageInfo" style="margin-left:8px;font-size:12px;color:#888;font-weight:400"></span></h2>
        <div class="toolbar">
            <input id="comicSearch" type="search" placeholder="Cari code / judul...">
            <select id="comicSort">
                <option value="views_desc" selected>Urut: Dilihat Terbanyak</option>
                <option value="title_asc">Urut: Judul A-Z</option>
                <option value="default">Urut: Default (Daftar)</option>
            </select>
            <button id="comicRefresh" class="btn ghost"><i class="fa-solid fa-rotate"></i> Refresh</button>
        </div>
        <div id="comicStatus" class="loading">Memuat...</div>
        <div id="comicGrid" class="genre-grid"></div>
    </div>
</div>
<script src="../tracker.js?v=1"></script>
<script>
(function() {
    'use strict';
    var API = 'https://countapi.mileshilliard.com/api/v1';
    var PREFIX = 'comichen';
    var CATALOG = ['daftar-comic.json', 'daftar-comic2.json', 'daftar-comic3.json',
                   'daftar-comic4.json', 'daftar-comic5.json'];
    var cache = {};
    var CACHE_TTL = 30000;
    var apiFails = 0;
    var failKeys = {};
    var retryRound = 0;

    function slug(str) {
        return String(str == null ? '' : str).toLowerCase()
            .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 100);
    }
    function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>]/g, function(m) {
            return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
        });
    }
    function fmt(n) {
        n = parseInt(n, 10) || 0;
        return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    var API_TIMEOUT = 5000;
    function fetchWithTimeout(url, ms) {
        ms = ms || API_TIMEOUT;
        if (!window.AbortController) {
            return fetch(url, { cache: 'no-store' }).then(function(r) {
                if (!r.ok) throw new Error('http ' + r.status);
                return r.json();
            });
        }
        var controller = new AbortController();
        var timer = setTimeout(function() { try { controller.abort(); } catch (e) {} }, ms);
        return fetch(url, { signal: controller.signal, cache: 'no-store' }).then(function(r) {
            clearTimeout(timer);
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
        }).catch(function(e) { clearTimeout(timer); throw e; });
    }
    function apiGet(key, retries) {
        if (retries === undefined) retries = 1;
        function attempt(a) {
            return fetchWithTimeout(API + '/get/' + encodeURIComponent(key)).then(function(j) {
                if (j && typeof j.value !== 'undefined') {
                    var v = parseInt(j.value, 10);
                    v = isNaN(v) ? 0 : v;
                    cache[key] = { ts: Date.now(), val: v };
                    delete failKeys[key];
                    return v;
                }
                if (a < retries) {
                    return new Promise(function(res) { setTimeout(function() { res(attempt(a + 1)); }, 300); });
                }
                failKeys[key] = true;
                return 0;
            }).catch(function() {
                failKeys[key] = true;
                if (a < retries) {
                    return new Promise(function(res) { setTimeout(function() { res(attempt(a + 1)); }, 300); });
                }
                return 0;
            });
        }
        var hit = cache[key];
        if (hit && Date.now() - hit.ts < CACHE_TTL) return Promise.resolve(hit.val);
        return attempt(0);
    }
    // SATU identitas utama per entri (jalur kunjungan terbanyak).
    // Terlalu banyak key paralel membuat API menolak semua (rate-limit).
    function entrySlugs(e) {
        var link = ((e && e.link) || '').trim();
        var base = link.split('?')[0].split('/').pop().replace(/\.html$/i, '');
        var codeNum = ((e && e.code) || '').trim().replace(/^#+/, '');
        if (base && base.toLowerCase() !== 'base') return [base];
        if (/base\.html/i.test(link) && codeNum) return ['base-' + codeNum];
        if (codeNum) return [codeNum];
        return [];
    }
    function limitedMap(items, limit, fn, onTick) {
        return new Promise(function(resolve) {
            var out = new Array(items.length);
            var i = 0, active = 0, done = 0;
            if (!items.length) { resolve(out); return; }
            function next() {
                while (active < limit && i < items.length) {
                    (function(idx) {
                        active++;
                        Promise.resolve()
                            .then(function() { return fn(items[idx], idx); })
                            .then(function(v) { out[idx] = v; }, function() { out[idx] = 0; })
                            .then(function() {
                                active--;
                                done++;
                                if (onTick) { try { onTick(done, items.length); } catch (e) {} }
                                if (done >= items.length) resolve(out);
                                else next();
                            });
                    })(i++);
                }
            }
            next();
        });
    }

    var comicData = [];
    function comicLink(e) {
        var link = ((e && e.link) || '').trim();
        if (!link) return '#';
        if (/^https?:\/\//i.test(link)) return link;
        return '../p/' + link;
    }
    function renderComicGrid() {
        var grid = document.getElementById('comicGrid');
        var statusEl = document.getElementById('comicStatus');
        var q = (document.getElementById('comicSearch').value || '').trim().toLowerCase();
        var sort = document.getElementById('comicSort').value;
        var items = comicData.slice();
        if (q) {
            items = items.filter(function(r) {
                var code = ((r.e.code || '').trim()).toLowerCase();
                var title = ((r.e.title || '').trim()).toLowerCase();
                return code.indexOf(q) !== -1 || title.indexOf(q) !== -1;
            });
        }
        if (sort === 'views_desc') items.sort(function(a, b) { return b.views - a.views; });
        else if (sort === 'title_asc') items.sort(function(a, b) {
            var ta = (((a.e.title || a.e.code) || a.slug) + '').toLowerCase();
            var tb = (((b.e.title || b.e.code) || b.slug) + '').toLowerCase();
            return ta < tb ? -1 : (ta > tb ? 1 : 0);
        });
        var shown = items.slice(0, 30);
        document.getElementById('comicPageInfo').textContent = items.length > 30 ?
            ('Menampilkan 30 dari ' + items.length + ' komik') :
            ('Menampilkan ' + items.length + ' komik');
        if (statusEl) statusEl.textContent = '';
        if (!comicData.length) {
            grid.innerHTML = '<div class="empty" style="width:100%">Belum ada data komik.</div>';
            return;
        }
        if (!shown.length) {
            grid.innerHTML = '<div class="empty" style="width:100%">Tidak ada yang cocok.</div>';
            return;
        }
        grid.innerHTML = shown.map(function(r, i) {
                    var code = ((r.e.code || '').trim()) || ('#' + r.slug);
            var title = ((r.e.title || '').trim()) || code;
            var img = ((r.e.image || '').trim());
            var thumb = img ? '<img class="video-thumb" src="' + esc(img) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
            return '<div class="dashboard-item">' +
                '<div class="dashboard-thumb-container">' + thumb + '</div>' +
                '<div class="dashboard-info">' +
                '<div class="dashboard-rank">#' + (i + 1) + '</div>' +
                '<div class="dashboard-title"><a href="' + esc(comicLink(r.e)) + '" target="_blank" rel="noopener">' + esc(title) + '</a></div>' +
                '<div class="dashboard-count"><i class="fa-solid fa-eye"></i> Dilihat <strong>' + fmt(r.views) + '</strong></div>' +
                '<div class="dashboard-count"><i class="fa-solid fa-book-open"></i> Dibaca <strong>' + fmt(r.reads || 0) + '</strong></div>' +
                '<div class="dashboard-count"><i class="fa-solid fa-barcode"></i> ' + esc(code) + '</div>' +
                '</div></div>';
        }).join('');
    }

    function loadComicStats() {
        var statusEl = document.getElementById('comicStatus');
        function status(t) { if (statusEl) statusEl.textContent = t; }
        apiFails = 0;
        failKeys = {};
        status('Memuat daftar komik...');
        Promise.all(CATALOG.map(function(name) {
            return fetch('../p/' + name + '?t=' + Date.now())
                .then(function(r) { if (!r.ok) throw 0; return r.json(); })
                .then(function(d) {
                    var l = (d && d.pages) || d;
                    return Array.isArray(l) ? l : [];
                }).catch(function() { return []; });
        })).then(function(lists) {
            var seen = {}, uniq = [];
            lists.forEach(function(items) {
                items.forEach(function(e) {
                    if (!e || e.lengkap !== 'yes') return;
                    var sl = entrySlugs(e);
                    if (!sl.length || seen[sl[0]]) return;
                    seen[sl[0]] = true;
                    uniq.push({ slug: sl[0], e: e });
                });
            });
            if (!uniq.length) { status('Tidak ada data komik.'); return; }
            // tampil langsung (0 + cache lokal), angka menyusul progresif per chunk
            comicData = uniq.map(function(it) { return { slug: it.slug, e: it.e, views: 0, reads: 0 }; });
            try {
                var cachedRows = JSON.parse(localStorage.getItem('comic_rows_cache') || 'null');
                if (cachedRows && cachedRows.length === uniq.length) {
                    var cm = {};
                    cachedRows.forEach(function(r) { if (r && r.slug) cm[r.slug] = r; });
                    comicData.forEach(function(r, i) {
                        var c = cm[r.slug];
                        if (c) comicData[i] = { slug: r.slug, e: r.e, views: c.views || 0, reads: c.reads || 0 };
                    });
                }
            } catch (e) {}
            renderComicGrid();
            function findRow(slg) {
                for (var k = 0; k < comicData.length; k++) {
                    if (comicData[k].slug === slg) return comicData[k];
                }
                return null;
            }
            // FASE 1: views semua (chunk 10 + jeda, render progresif)
            var CHUNK = 10, ci = 0;
            function phase1() {
                if (ci >= uniq.length) { phase2(); return; }
                var slice = uniq.slice(ci, ci + CHUNK);
                Promise.all(slice.map(function(it) {
                    return apiGet(PREFIX + '_page_' + slug(it.slug));
                })).then(function(vals) {
                    for (var j = 0; j < slice.length; j++) {
                        var row = findRow(slice[j].slug);
                        if (row) row.views = vals[j] || 0;
                    }
                    renderComicGrid();
                    document.getElementById('comicPageInfo').textContent =
                        'Memuat Dilihat ' + Math.min(ci + CHUNK, uniq.length) + '/' + uniq.length + '...';
                    ci += CHUNK;
                    setTimeout(phase1, 120);
                });
            }
            // FASE 2: reads hanya Top 30 (hemat ratusan request)
            function phase2() {
                var ranked = comicData.slice().sort(function(a, b) { return b.views - a.views; }).slice(0, 30);
                if (!ranked.length) { finish(); return; }
                document.getElementById('comicPageInfo').textContent = 'Memuat Dibaca Top ' + ranked.length + '...';
                var k = 0;
                function step() {
                    if (k >= ranked.length) { finish(); return; }
                    var slice = ranked.slice(k, k + 8);
                    Promise.all(slice.map(function(r) {
                        return apiGet(PREFIX + '_read_' + slug(r.slug));
                    })).then(function(vals) {
                        for (var j = 0; j < slice.length; j++) { slice[j].reads = vals[j] || 0; }
                        renderComicGrid();
                        k += 8;
                        setTimeout(step, 120);
                    });
                }
                step();
            }
            function finish() {
                try { localStorage.setItem('comic_rows_cache', JSON.stringify(comicData)); } catch (e) {}
                try {
                    document.getElementById('lastUpdate').textContent = 'Update: ' +
                        new Date().toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
                } catch (e) {}
                renderComicGrid();
            }
            phase1();
        }).catch(function() {
            document.getElementById('comicStatus').textContent = 'Gagal memuat data.';
        });
    }

    document.getElementById('comicSearch').addEventListener('input', renderComicGrid);
    document.getElementById('comicSort').addEventListener('change', renderComicGrid);
    document.getElementById('comicRefresh').addEventListener('click', function() {
        cache = {};
        document.getElementById('comicStatus').textContent = 'Memuat ulang...';
        loadComicStats();
    });
    loadComicStats();
})();
</script>
</body>
</html>
