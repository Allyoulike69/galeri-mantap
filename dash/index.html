<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard Admin</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 600px at 50% -100px, #221016 0%, #0a0a0a 55%) fixed, #0a0a0a;
    color: #eee; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .panel {
    border: 1px solid #333; border-radius: 14px;
    background: rgba(255,255,255,.015);
    padding: 6px 18px 22px; margin-top: 4px;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; letter-spacing: .5px; }
  h1 .accent { color: #f10000; }
  .sub { color: #888; font-size: 13px; }
  .sub .dw { color: #fff; }
  .sub .dr { color: #fff; }
  .topnav {
    display: flex; gap: 8px; flex-wrap: wrap;
    background: rgba(12,12,12,.88);
    padding: 12px 0; margin: 14px 0 4px;
    border-bottom: 1px solid #222;
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0 8px; }
  .card {
    background: linear-gradient(180deg, #181818, #111);
    border: 1px solid #2c2c2c; border-top: 3px solid #f10000;
    border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,.35);
    transition: transform .15s;
  }
  .card:hover { transform: translateY(-2px); }
  .card .num { font-size: 30px; font-weight: 800; color: #ffa74e; }
  .card .lbl { font-size: 13px; color: #aaa; }
  h2 { font-size: 17px; margin: 24px 0 10px; padding-left: 10px; border-left: 4px solid #f10000; }
  table {
    width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px;
    background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden;
  }
  th, td { text-align: left; padding: 10px 12px; }
  th { color: #ffa74e; background: #1e1e1e; font-size: 13px; text-transform: uppercase; letter-spacing: .5px; }
  tbody td { border-top: 1px solid #232323; }
  tbody tr:hover td { background: #1b1b1b; }
  .ok { color: #4dff88; font-weight: 700; }
  .warn { color: #ff5555; font-weight: 700; }
  .dim { color: #888; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; }
  .links a {
    background: linear-gradient(180deg, #262626, #1b1b1b);
    border: 1px solid #3a3a3a; color: #fff; text-decoration: none;
    padding: 9px 16px; border-radius: 5px; font-size: 14px; font-weight: 600;
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .links a:hover { border-color: #f10000; box-shadow: 0 0 12px rgba(241,0,0,.35); transform: translateY(-1px); }
  .links a.red { background: linear-gradient(180deg, #ff2b2b, #c80000); border-color: #ff2b2b; }
  .links a.red:hover { box-shadow: 0 0 14px rgba(241,0,0,.5); }
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
  <h1>Dashboard <span class="accent">Admin</span></h1>
  <div class="sub" id="dashDate"></div>
</div>

<div class="panel">
<nav class="topnav links">
  <a class="red" href="index.html">Home</a>
  <a href="../index.html" target="_blank" rel="noopener">Lihat Situs</a>
  <a href="statistik.html" target="_blank" rel="noopener">Dashboard Statistik</a>
  <a href="../format-comic.html" target="_blank" rel="noopener">Format Comic</a>
  <a href="../format-gambar.html" target="_blank" rel="noopener">Format Gambar</a>
</nav>

  <div class="cards">
    <div class="card"><div class="num" id="stComic">-</div><div class="lbl">Total Komik (lengkap)</div></div>
    <div class="card"><div class="num" id="stFiles">-</div><div class="lbl">File Data Aktif</div></div>
    <div class="card"><div class="num" id="stPics">-</div><div class="lbl">Gambar Gallery (id-comic)</div></div>
    <div class="card"><div class="num" id="stPages">-</div><div class="lbl">File Gallery Aktif</div></div>
  </div>

  <h2>Status File Data</h2>
  <table>
    <thead><tr><th>File</th><th>Entri</th><th>Tampil</th><th>Status</th></tr></thead>
    <tbody id="fileRows"><tr><td colspan="4" class="dim">memuat...</td></tr></tbody>
  </table>

  <h2>Duplikat Terdeteksi</h2>
  <table>
    <thead><tr><th>Code</th><th>Title</th><th>Sumber</th><th>Ada di File</th><th>Jumlah</th></tr></thead>
    <tbody id="dupRows"><tr><td colspan="5" class="dim">memuat...</td></tr></tbody>
  </table>

</div>

</div>

<script>
  (function() {
    var d = new Date();
    var days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    var months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    function pad(n) { return (n < 10 ? '0' : '') + n; }
    document.getElementById('dashDate').innerHTML =
      '<span class="dw">' + days[d.getDay()] + '</span>, ' +
      '<span class="dr">' + d.getDate() + '</span> ' +
      '<span class="dw">' + months[d.getMonth()] + '</span> ' +
      '<span class="dr">' + d.getFullYear() + '</span> ' +
      '<span class="dw">pukul</span> ' +
      '<span class="dr">' + pad(d.getHours()) + '.' + pad(d.getMinutes()) + '</span>';
  })();

  var CATALOG = ['daftar-comic.json', 'daftar-comic2.json', 'daftar-comic3.json',
                 'daftar-comic4.json', 'daftar-comic5.json'];
  var GALLERY = ['id-comic.json', 'id-comic2.json', 'id-comic3.json',
                 'id-comic4.json', 'id-comic5.json'];

  function get(url) {
    return fetch('../p/' + url + '?t=' + Date.now())
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function() { return null; });
  }
  function asList(data, key) {
    if (!data) return null;
    var l = data[key] || data.pages || data;
    return Array.isArray(l) ? l : [];
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function(m) {
      return m === '&' ? '&amp;' : (m === '<' ? '&lt;' : '&gt;');
    });
  }

  function fileRowHtml(name, list) {
    var show = list.filter(function(p) { return p.lengkap === 'yes'; }).length;
    return '<tr><td>' + name + '</td><td>' + list.length + '</td><td>' + show +
      '</td><td class="' + (show > 0 ? 'ok">aktif' : 'warn">kosong') + '</td></tr>';
  }
  function missingRowHtml(name) {
    return '<tr><td>' + name + '</td><td>-</td><td>-</td><td class="dim">tidak ada</td></tr>';
  }
  function normCode(c) { return String(c == null ? '' : c).trim().replace(/^#+/, '').toLowerCase(); }
  function trackDup(map, src, name, p) {
    var ck = normCode(p.code);
    if (!ck) return;
    var key = src + '|' + ck;
    if (!map[key]) map[key] = { code: (p.code || '').trim(), title: p.title || '', src: src, files: [], count: 0 };
    map[key].files.push(name);
    map[key].count++;
    if (!map[key].title && p.title) map[key].title = p.title;
  }

  Promise.all(CATALOG.map(get)).then(function(catResults) {
    var all = [];
    var rows = '';
    var activeFiles = 0;
    var dupMap = {};
    catResults.forEach(function(data, i) {
      var name = CATALOG[i];
      if (!data) { rows += missingRowHtml(name); return; }
      var list = asList(data) || [];
      activeFiles++;
      all = all.concat(list);
      rows += fileRowHtml(name, list);
      list.forEach(function(p) { trackDup(dupMap, 'katalog', name, p); });
    });

    return Promise.all(GALLERY.map(get)).then(function(galResults) {
      var pics = 0, galFiles = 0;
      galResults.forEach(function(data, i) {
        var name = GALLERY[i];
        if (!data) { rows += missingRowHtml(name); return; }
        var list = asList(data, 'raw-links') || [];
        galFiles++;
        rows += fileRowHtml(name, list);
        list.forEach(function(p) { trackDup(dupMap, 'galeri', name, p); });
        list.forEach(function(e) {
          var s = Array.isArray(e.picture) ? e.picture.join(' ') : String(e.picture || '');
          pics += s.split(/\s+/).filter(function(u) { return u.indexOf('http') === 0; }).length;
        });
      });

      document.getElementById('fileRows').innerHTML = rows;
      var shown = all.filter(function(p) { return p.lengkap === 'yes'; });
      document.getElementById('stComic').textContent = shown.length;
      document.getElementById('stFiles').textContent = activeFiles + ' / ' + CATALOG.length;

      // detektor duplikat: code sama di 2+ tempat (per pool katalog/galeri)
      var dups = Object.keys(dupMap).map(function(k) { return dupMap[k]; })
        .filter(function(d) { return d.count > 1; })
        .sort(function(a, b) { return b.count - a.count; });
      document.getElementById('dupRows').innerHTML = dups.map(function(d) {
        var files = d.files.filter(function(f, idx, arr) { return arr.indexOf(f) === idx; });
        return '<tr><td>' + esc(d.code) + '</td><td>' + esc(d.title || '-') +
          '</td><td>' + esc(d.src) + '</td><td>' + esc(files.join(', ')) +
          '</td><td class="warn">' + d.count + 'x</td></tr>';
      }).join('') || '<tr><td colspan="5" class="ok">Bersih — tidak ada duplikat.</td></tr>';

      document.getElementById('stPics').textContent = pics;
      document.getElementById('stPages').textContent = galFiles + ' / ' + GALLERY.length;
    });
  });
</script>
</body>
</html>
